<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Boris · трей</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.tl{--wall:#C9CCD3;--bar:rgba(242,242,244,.94);--bar-tx:#1D1D1F;--menu:#F4F4F5;--menu-bd:rgba(0,0,0,.14);--hi:#0A64D8;--tx-1:#1D1D1F;--tx-2:#55555A;--tx-3:#6A6A6F;--sep:rgba(0,0,0,.1);--st-red:#E5383B;color:#1D1D1F}
.td{--wall:#2B2D33;--bar:rgba(30,30,32,.94);--bar-tx:#F2F2F4;--menu:#2C2C2E;--menu-bd:rgba(255,255,255,.14);--hi:#2F6FD8;--tx-1:#F2F2F4;--tx-2:#B0B0B6;--tx-3:#A2A2A8;--sep:rgba(255,255,255,.12);--st-red:#E5383B;color:#F2F2F4}
</style>
</helmet>
<div style="width: 1500px; height: 640px; display: flex; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif">
  <sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
    <div class="{{th.cls}}" style="flex: 1 1 0px; position: relative; overflow: hidden; background: var(--wall); color: var(--tx-1)">
      <div style="height: 24px; background: var(--bar); color: var(--bar-tx); display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 14px; font-size: 13px">
        <span style="display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 5px; border-radius: 4px; background: {{th.press}}">
          <span style="position: relative; display: inline-flex; width: 18px; height: 18px">
            <svg viewBox="0 0 18 18" width="18" height="18" role="img" aria-label="Boris"><rect x="2" y="2" width="14" height="14" rx="4" style="fill: none; stroke: currentColor; stroke-width: 1.4; stroke-dasharray: 2.2 1.6"></rect><path d="M5 5l8 8M13 5l-8 8" style="stroke: currentColor; stroke-width: 1; stroke-opacity: .55"></path></svg>
          </span>
          <span style="font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums">1</span>
        </span>
        <span style="font-variant-numeric: tabular-nums">Чт 5 нояб. 16:21</span>
      </div>
      <span style="position: absolute; left: 24px; top: 40px; font-size: 12px; font-weight: 600; color: var(--tx-2)">{{th.label}}</span>

      <div role="menu" aria-label="Меню Boris" style="position: absolute; right: 120px; top: 28px; width: 250px; padding: 5px; box-sizing: border-box; border-radius: 8px; background: var(--menu); box-shadow: 0 0 0 0.5px var(--menu-bd), 0 10px 30px rgba(0,0,0,.28); font-size: 13px">
        <sc-for list="{{th.items}}" as="i" hint-placeholder-count="6">
          <div style="display: flex; flex-direction: column">
            <sc-if value="{{i.sep}}" hint-placeholder-val="{{ false }}"><div role="separator" style="height: 1px; margin: 5px 8px; background: var(--sep)"></div></sc-if>
            <sc-if value="{{i.t}}" hint-placeholder-val="{{ true }}">
              <div role="menuitem" aria-haspopup="{{i.popup}}" style="display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px 0 6px; border-radius: 4px; background: {{i.bg}}; color: {{i.c}}">
                <span style="width: 14px; font-size: 12px; text-align: center">{{i.check}}</span>
                <span style="flex: 1; white-space: nowrap">{{i.t}}</span>
                <span style="font-size: 12px; opacity: .7; white-space: nowrap">{{i.k}}</span>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <sc-if value="{{th.sub}}" hint-placeholder-val="{{ false }}">
        <div role="menu" aria-label="Не беспокоить" style="position: absolute; right: 375px; top: 82px; width: 170px; padding: 5px; box-sizing: border-box; border-radius: 8px; background: var(--menu); box-shadow: 0 0 0 0.5px var(--menu-bd), 0 10px 30px rgba(0,0,0,.28); font-size: 13px">
          <sc-for list="{{th.sub}}" as="s" hint-placeholder-count="3">
            <div role="menuitem" style="display: flex; align-items: center; height: 22px; padding: 0 8px 0 26px; border-radius: 4px; background: {{s.bg}}; color: {{s.c}}">{{s.t}}</div>
          </sc-for>
        </div>
      </sc-if>

      <div style="position: absolute; left: 24px; right: 24px; bottom: 24px; font-size: 12px; line-height: 17px; color: var(--tx-2)">{{th.note}}</div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1500,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const it = (t, k, o) => Object.assign({ t, k: k || '', sep: false, check: '', popup: 'false', bg: 'transparent', c: 'var(--tx-1)' }, o || {});
    const sep = { sep: true, t: '' };
    return {
      themes: [
        { cls: 'td', label: 'Тёмная строка меню · правый клик, «Не беспокоить» раскрыто', press: 'rgba(255,255,255,.18)',
          items: [ it('Открыть Boris'), it('Не беспокоить', '›', { popup: 'true', bg: 'var(--hi)', c: '#FFFFFF' }), sep, it('Настройки…', '⌘,'), it('О Boris'), sep, it('Выход', '⌘Q') ],
          sub: [ { t: 'На час', bg: 'transparent', c: 'var(--tx-1)' }, { t: 'На 4 часа', bg: 'transparent', c: 'var(--tx-1)' }, { t: 'До выключения', bg: 'transparent', c: 'var(--tx-1)' } ],
          note: 'Левый клик открывает мини-окно (то же, что ⌥⌘O). Правый клик: системное меню. Число рядом с моржом: ожидающие запросы.' },
        { cls: 'tl', label: 'Светлая строка меню · «Не беспокоить» включён', press: 'rgba(0,0,0,.12)',
          items: [ it('Открыть Boris'), it('Не беспокоить до 17:21', '', { check: '✓' }), it('Выключить «Не беспокоить»', '', { c: 'var(--tx-1)' }), sep, it('Настройки…', '⌘,'), it('О Boris'), sep, it('Выход', '⌘Q') ],
          sub: null,
          note: 'В режиме «не беспокоить» уведомлений нет, но запросы остаются в очереди и в счётчике у значка.' }
      ]
    };
  }
}
</script>
</body>
</html>
