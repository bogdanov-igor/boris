<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>StatusIcon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<span style="display: inline-flex; flex: none; width: {{sz}}px; height: {{sz}}px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; color: inherit">
  <sc-if value="{{k.running}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 16 16" width="{{sz}}" height="{{sz}}" role="img" aria-label="Идёт"><circle cx="8" cy="8" r="6.2" style="fill: none; stroke: var(--st-run, #1A6F75); stroke-opacity: .3; stroke-width: 1.6"></circle><path d="M8 1.8 A6.2 6.2 0 0 1 14.2 8" style="fill: none; stroke: var(--st-run, #1A6F75); stroke-width: 1.6; stroke-linecap: round"></path><circle cx="8" cy="8" r="2" style="fill: var(--st-run, #1A6F75)"></circle></svg>
  </sc-if>
  <sc-if value="{{k.silent}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 16 16" width="{{sz}}" height="{{sz}}" role="img" aria-label="Молчит"><circle cx="8" cy="8" r="6.2" style="fill: none; stroke: var(--st-smoke, #8A8A92); stroke-width: 1.6; stroke-dasharray: 2.3 2.2"></circle><circle cx="8" cy="8" r="1.6" style="fill: var(--st-smoke, #8A8A92)"></circle></svg>
  </sc-if>
  <sc-if value="{{k.done}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 16 16" width="{{sz}}" height="{{sz}}" role="img" aria-label="Завершён"><circle cx="8" cy="8" r="7" style="fill: var(--st-done, #1A7340)"></circle><path d="M4.8 8.3l2.1 2.1 4.3-4.6" style="fill: none; stroke: #FFFFFF; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round"></path></svg>
  </sc-if>
  <sc-if value="{{k.doneErr}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 16 16" width="{{sz}}" height="{{sz}}" role="img" aria-label="Завершён с ошибками"><circle cx="7.4" cy="8.6" r="5.9" style="fill: none; stroke: var(--st-done, #1A7340); stroke-width: 1.5"></circle><path d="M4.7 8.8l1.8 1.8 3.4-3.7" style="fill: none; stroke: var(--st-done, #1A7340); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"></path><circle cx="12.6" cy="3.6" r="3.1" style="fill: var(--st-red, #E5383B); stroke: var(--row-bg, var(--pop, #F6F6F7)); stroke-width: 1.4"></circle></svg>
  </sc-if>
  <sc-if value="{{k.allFailed}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 16 16" width="{{sz}}" height="{{sz}}" role="img" aria-label="Упали все агенты"><circle cx="8" cy="8" r="7.4" style="fill: var(--st-red, #E5383B)"></circle><path d="M5.4 5.4l5.2 5.2M10.6 5.4l-5.2 5.2" style="fill: none; stroke: #FFFFFF; stroke-width: 1.9; stroke-linecap: round"></path></svg>
  </sc-if>
  <sc-if value="{{k.failed}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 16 16" width="{{sz}}" height="{{sz}}" role="img" aria-label="Упал"><circle cx="8" cy="8" r="6.2" style="fill: none; stroke: var(--st-red, #E5383B); stroke-width: 1.6"></circle><path d="M5.9 5.9l4.2 4.2M10.1 5.9l-4.2 4.2" style="fill: none; stroke: var(--st-red, #E5383B); stroke-width: 1.6; stroke-linecap: round"></path></svg>
  </sc-if>
  <sc-if value="{{k.interrupted}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 16 16" width="{{sz}}" height="{{sz}}" role="img" aria-label="Прерван"><circle cx="8" cy="8" r="6.2" style="fill: none; stroke: var(--st-red, #E5383B); stroke-width: 1.6"></circle><path d="M3.8 12.2L12.2 3.8" style="fill: none; stroke: var(--st-red, #E5383B); stroke-width: 1.6; stroke-linecap: round"></path></svg>
  </sc-if>
  <sc-if value="{{k.stopped}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 16 16" width="{{sz}}" height="{{sz}}" role="img" aria-label="Остановлен"><rect x="3.5" y="3.5" width="9" height="9" rx="2" style="fill: var(--st-grey, #6A6A6F)"></rect></svg>
  </sc-if>
  <sc-if value="{{k.unknown}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 16 16" width="{{sz}}" height="{{sz}}" role="img" aria-label="Неизвестный статус"><circle cx="8" cy="8" r="6.2" style="fill: none; stroke: var(--st-grey, #6A6A6F); stroke-width: 1.3"></circle><path d="M6.3 6.3a1.8 1.8 0 1 1 2.6 1.6c-.6.3-.9.7-.9 1.3v.3" style="fill: none; stroke: var(--st-grey, #6A6A6F); stroke-width: 1.4; stroke-linecap: round"></path><circle cx="8" cy="11.3" r=".9" style="fill: var(--st-grey, #6A6A6F)"></circle></svg>
  </sc-if>
  <sc-if value="{{k.waiting}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 16 16" width="{{sz}}" height="{{sz}}" role="img" aria-label="Ждёт тебя"><circle cx="8" cy="8" r="7" style="fill: var(--st-wait, #1D66C9)"></circle><circle cx="5" cy="8" r="1.15" style="fill: #FFFFFF"></circle><circle cx="8" cy="8" r="1.15" style="fill: #FFFFFF"></circle><circle cx="11" cy="8" r="1.15" style="fill: #FFFFFF"></circle></svg>
  </sc-if>
  <sc-if value="{{k.limit}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 16 16" width="{{sz}}" height="{{sz}}" role="img" aria-label="Лимит"><circle cx="8" cy="8" r="6.2" style="fill: none; stroke: var(--st-limit, #4A4FBF); stroke-width: 1.5"></circle><path d="M5.6 4.7h4.8L8 8l2.4 3.3H5.6L8 8z" style="fill: var(--st-limit, #4A4FBF)"></path></svg>
  </sc-if>
  <sc-if value="{{k.idle}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 16 16" width="{{sz}}" height="{{sz}}" role="img" aria-label="Свободна"><circle cx="8" cy="8" r="5.6" style="fill: none; stroke: var(--st-grey, #6A6A6F); stroke-width: 1.4"></circle></svg>
  </sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["running","silent","done","doneErr","allFailed","failed","interrupted","stopped","unknown","waiting","limit","idle"],"default":"running"},"size":{"editor":"int","default":16,"min":10,"max":40},"$preview":{"width":40,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'running';
    const all = ['running','silent','done','doneErr','allFailed','failed','interrupted','stopped','unknown','waiting','limit','idle'];
    const k = {};
    all.forEach((x) => { k[x] = x === kind; });
    if (!all.includes(kind)) k.unknown = true;
    return { k, sz: Number(this.props.size ?? 16) };
  }
}
</script>
</body>
</html>
